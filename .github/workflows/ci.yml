name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API: 403 without this.
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # >>> project checks — filled by /onboard: setup, install, lint, typecheck, test, build,
      #     and a disposable database service when the project has one.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No lint in this project yet.
      - run: npm run typecheck
      - run: npm test
      # Local Supabase (Docker) for the permission tests; the CLI comes from the lockfile.
      - run: npx supabase start
      # tests/db/admin-usuarios.test.ts calls the Edge Function; config.toml keeps the edge runtime off to save RAM.
      - name: Serve the admin-usuarios Edge Function
        run: |
          nohup npx supabase functions serve admin-usuarios --no-verify-jwt > functions-serve.log 2>&1 &
          for i in $(seq 1 60); do
            # Kong answers 503 "name resolution failed" until the function container is up.
            body=$(curl -s -X POST http://127.0.0.1:54321/functions/v1/admin-usuarios || true)
            if [ -n "$body" ] && ! echo "$body" | grep -qiE "name resolution|no route|upstream"; then
              echo "function ready: $body"; exit 0
            fi
            sleep 2
          done
          cat functions-serve.log; exit 1
      - run: npm run test:db
      - run: npm run build
        # Public client config only; the real values come from the hosting env.
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_API_KEY: ci-placeholder
      - run: npm audit --audit-level=high
      # <<< project checks

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repos owned by an organization need a free license from gitleaks.io:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  skills-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .agents/skills mirrors .claude/skills
        run: |
          if [ -d .claude/skills ] || [ -d .agents/skills ]; then
            diff -r .claude/skills .agents/skills
          fi
