name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API: 403 without this.
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # >>> project checks — filled by /onboard: setup, install, lint, typecheck, test, build,
      #     and a disposable database service when the project has one.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The Firestore emulator (npm run test:rules) needs Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # No lint in this project yet.
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
        # Public client config only; the real values come from the hosting env.
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
          VITE_FIREBASE_APP_ID: ci-placeholder
          VITE_API_KEY: ci-placeholder
      - run: npm audit --audit-level=high
      # <<< project checks

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repos owned by an organization need a free license from gitleaks.io:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  skills-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .agents/skills mirrors .claude/skills
        run: |
          if [ -d .claude/skills ] || [ -d .agents/skills ]; then
            diff -r .claude/skills .agents/skills
          fi
